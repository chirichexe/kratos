apiVersion: batch/v1
kind: Job
metadata:
  name: nsight-compute-nvidia-sample-sidecar
spec:
  backoffLimit: 0
  template:
    spec:
      runtimeClassName: nvidia
      restartPolicy: Never
      containers:
        - name: nvidia-sample-workload
          image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda12.5.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              cp /cuda-samples/vectorAdd /shared/vectorAdd
              chmod +x /shared/vectorAdd
              touch /shared/workload-ready
              echo "NVIDIA sample workload is ready"
              while [ ! -f /shared/profiling-done ]; do
                sleep 1
              done
              echo "Nsight Compute profiling runner completed"
          volumeMounts:
            - name: shared
              mountPath: /shared
        - name: ncu-sidecar
          image: kratos-nsight-compute-poc:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              trap 'touch /shared/profiling-done' EXIT
              mkdir -p /shared/nsight-compute
              while [ ! -f /shared/workload-ready ]; do
                sleep 1
              done
              echo "== nvidia-smi =="
              nvidia-smi
              echo "== ncu --version =="
              ncu --version
              echo "== NVIDIA sample smoke test =="
              /shared/vectorAdd
              echo "== ncu profiling runner of NVIDIA sample =="
              ncu --target-processes all \
                --set basic \
                --kernel-name regex:vectorAdd \
                --launch-count 1 \
                --force-overwrite \
                --export /shared/nsight-compute/nvidia-vectoradd \
                /shared/vectorAdd
              echo "== ncu imported raw metrics =="
              ncu --import /shared/nsight-compute/nvidia-vectoradd.ncu-rep \
                --page raw \
                --print-units base
              echo "== generated reports =="
              ls -lh /shared/nsight-compute
          securityContext:
            capabilities:
              add:
                - SYS_ADMIN
          volumeMounts:
            - name: shared
              mountPath: /shared
          resources:
            limits:
              nvidia.com/gpu: 1
      volumes:
        - name: shared
          emptyDir: {}
