apiVersion: batch/v1
kind: Job
metadata:
  name: nsight-compute-vectoradd
spec:
  backoffLimit: 0
  template:
    spec:
      runtimeClassName: nvidia
      restartPolicy: Never
      initContainers:
        - name: copy-vectoradd
          image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda12.5.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - cp /cuda-samples/vectorAdd /workload/vectorAdd && chmod +x /workload/vectorAdd
          volumeMounts:
            - name: workload
              mountPath: /workload
      containers:
        - name: nsight-compute
          image: kratos-nsight-compute-poc:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /tmp/nsight-compute
              echo "== nvidia-smi =="
              nvidia-smi
              echo "== ncu --version =="
              ncu --version
              echo "== workload smoke test =="
              /workload/vectorAdd
              echo "== ncu profile =="
              ncu --target-processes all \
                --set basic \
                --kernel-name regex:vectorAdd \
                --launch-count 1 \
                --force-overwrite \
                --export /tmp/nsight-compute/vectoradd \
                /workload/vectorAdd
              echo "== ncu imported raw metrics =="
              ncu --import /tmp/nsight-compute/vectoradd.ncu-rep \
                --page raw \
                --print-units base
              echo "== generated reports =="
              ls -lh /tmp/nsight-compute
          securityContext:
            capabilities:
              add:
                - SYS_ADMIN
          volumeMounts:
            - name: workload
              mountPath: /workload
          resources:
            limits:
              nvidia.com/gpu: 1
      volumes:
        - name: workload
          emptyDir: {}
