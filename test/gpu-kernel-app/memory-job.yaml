apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-memory-bound
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: gpu-memory
          image: kratos-gpu-kernel-test:latest
          imagePullPolicy: IfNotPresent
          args: ["memory"]
          resources:
            limits:
              nvidia.com/gpu: 1
