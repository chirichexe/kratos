name: CI

on:
  pull_request:
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - Makefile
      - Dockerfile
      - PROJECT
      - api/**
      - cmd/**
      - config/**
      - internal/**
      - test/**
      - hack/**
      - .golangci.yml
      - .github/workflows/ci.yml
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - Makefile
      - Dockerfile
      - PROJECT
      - api/**
      - cmd/**
      - config/**
      - internal/**
      - test/**
      - hack/**
      - .golangci.yml
      - .github/workflows/ci.yml

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l $(find . -name '*.go'))"

      - name: Run tests
        run: make test
