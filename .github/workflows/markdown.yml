name: Markdown Check

on:
  pull_request:
    paths:
      - "**/*.md"
      - docs/**
      - .github/pull_request_template.md
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/markdown.yml
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - docs/**
      - .github/pull_request_template.md
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/markdown.yml

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check Markdown files
        run: |
          find . -name "*.md"
