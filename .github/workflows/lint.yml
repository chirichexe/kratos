name: Lint

on:
  push:
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - Makefile
      - PROJECT
      - api/**
      - cmd/**
      - config/**
      - internal/**
      - test/**
      - hack/**
      - .golangci.yml
      - .github/workflows/lint.yml
  pull_request:
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - Makefile
      - PROJECT
      - api/**
      - cmd/**
      - config/**
      - internal/**
      - test/**
      - hack/**
      - .golangci.yml
      - .github/workflows/lint.yml

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint
