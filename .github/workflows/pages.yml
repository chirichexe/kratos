name: Pages

on:
  push:
    branches:
      - main
    paths:
      - mkdocs.yml
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install MkDocs
        run: python -m pip install mkdocs

      - name: Deploy documentation
        run: mkdocs gh-deploy --force --clean --strict
