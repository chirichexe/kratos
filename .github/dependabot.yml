version: 2

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"

    open-pull-requests-limit: 3

    groups:
      kubernetes:
        patterns:
          - "k8s.io/*"

      testing:
        patterns:
          - "github.com/onsi/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

    open-pull-requests-limit: 2

    groups:
      actions:
        patterns:
          - "actions/*"
