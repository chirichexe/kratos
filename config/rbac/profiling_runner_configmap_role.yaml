# Grants profiling runner Pods permission to publish parser summaries.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kratos
    app.kubernetes.io/managed-by: kustomize
  name: profiling-runner-configmap-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
  - get
  - patch
  - update
