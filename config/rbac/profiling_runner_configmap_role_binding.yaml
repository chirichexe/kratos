# Allows profiling runner Pods in workload namespaces to publish summary ConfigMaps.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: kratos
    app.kubernetes.io/managed-by: kustomize
  name: profiling-runner-configmap-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: profiling-runner-configmap-role
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: system:serviceaccounts
