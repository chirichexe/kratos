---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-gpu-scheduler-io-v1alpha1-cudaexperiment
  failurePolicy: Fail
  name: vcudaexperiment-v1alpha1.kb.io
  rules:
  - apiGroups:
    - gpu.scheduler.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - cudaexperiments
  sideEffects: None
